<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Script Upload</title>
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
            background: linear-gradient(135deg, #0061f2 0%, #00ba94 100%) !important;
            padding: 1.25rem;
        }

        .drag-area {
            border: 2px dashed #c3cfe2;
            border-radius: 15px;
            padding: 2.5rem;
            text-align: center;
            background: rgba(245, 247, 250, 0.8);
            transition: all 0.3s ease;
        }
        
        .drag-area.active {
            border-color: #0061f2;
            background: rgba(0, 97, 242, 0.05);
        }

        .drag-area i {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0061f2 0%, #00ba94 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .file-info {
            margin-top: 1rem;
            display: none;
            background: rgba(245, 247, 250, 0.8);
            padding: 1rem;
            border-radius: 10px;
        }
        
        .upload-progress {
            display: none;
            margin: 1.5rem 0;
        }

        .progress {
            height: 0.8rem;
            border-radius: 1rem;
            background-color: #e9ecef;
        }

        .progress-bar {
            background: linear-gradient(135deg, #0061f2 0%, #00ba94 100%);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0061f2 0%, #00ba94 100%);
            border: none;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,97,242,0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #00ba94 0%, #00ba74 100%);
            border: none;
            padding: 0.75rem 1.5rem;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
        }

        #responseArea {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: vertical;
        }

        .alert {
            border-radius: 10px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* Animation for drag area */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .drag-area.active {
            animation: pulse 1.5s infinite;
        }

        /* Custom scrollbar for response area */
        #responseArea::-webkit-scrollbar {
            width: 8px;
        }

        #responseArea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        #responseArea::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        #responseArea::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="alert alert-dismissible fade mb-3" role="alert" id="alertBox">
                    <span id="alertMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h4 class="mb-0 text-white d-flex align-items-center">
                            <i class="fas fa-upload me-3"></i>
                            Protocol Script Upload
                            <small class="ms-auto" style="font-size: 0.8rem;">Max size: 5MB</small>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="drag-area" id="dropZone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h5 class="mb-3">Drag & Drop your Python script here</h5>
                            <p class="text-muted mb-3">or</p>
                            <button class="btn btn-primary" id="browseBtn">
                                <i class="fas fa-folder-open me-2"></i>Browse Files
                            </button>
                            <input type="file" id="fileInput" accept=".py" single hidden>
                        </div>
                        
                        <div class="file-info" id="fileInfo">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-file-code text-primary me-3 fa-lg"></i>
                                <span id="fileName" class="me-auto fw-bold"></span>
                                <button class="btn btn-sm btn-danger" id="removeFile">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="upload-progress" id="uploadProgress">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-end">
                            <button class="btn btn-success" id="uploadBtn" disabled>
                                <i class="fas fa-paper-plane me-2"></i>Upload Script
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Response Display Area -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0 text-white d-flex align-items-center">
                            <i class="fas fa-code me-3"></i>
                            API Response
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <textarea id="responseArea" class="form-control" rows="8" readonly 
                            placeholder="API response will appear here..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="upload.js"></script>
</body>
</html>
