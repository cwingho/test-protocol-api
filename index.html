<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Script Upload</title>
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-md-11">
                <div class="alert alert-dismissible fade mb-3" role="alert" id="alertBox">
                    <span id="alertMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="row g-4">
                    <!-- Upload Card -->
                    <div class="col-md-7">
                        <div class="card h-100">
                            <div class="card-header">
                                <h4 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-upload me-3"></i>
                                    Protocol Script Upload
                                    <small class="ms-auto" style="font-size: 0.8rem;">Max size: 5MB</small>
                                </h4>
                            </div>
                            <div class="card-body p-4">
                                <div class="url-input-container mb-4">
                                    <label for="serverUrl" class="form-label">Server URL/IP</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-link"></i>
                                        </span>
                                        <input type="text" 
                                               class="form-control" 
                                               id="serverUrl" 
                                               placeholder="Enter server URL or IP address"
                                               value="http://172.20.17.155:41950">
                                    </div>
                                </div>
                                
                                <div class="drag-area" id="dropZone">
                                    <div class="upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="upload-text">
                                        <h5 class="mb-1">Upload your Python script</h5>
                                        <p class="text-muted mb-3">Drag and drop your file here or click to browse</p>
                                        <p class="file-hint">Python files only (.py)</p>
                                    </div>
                                    <button class="btn btn-outline" id="browseBtn">
                                        Choose file
                                    </button>
                                    <input type="file" id="fileInput" accept=".py" single hidden>
                                </div>
                                
                                <div class="file-info" id="fileInfo">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-file-code text-primary me-3 fa-lg"></i>
                                        <span id="fileName" class="me-auto fw-bold"></span>
                                        <button class="btn btn-sm btn-danger" id="removeFile">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="upload-progress" id="uploadProgress">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                             role="progressbar" style="width: 0%">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mt-4 text-end">
                                    <button class="btn btn-success" id="uploadBtn" disabled>
                                        <i class="fas fa-paper-plane me-2"></i>Upload Script
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Response Display Area -->
                    <div class="col-md-5">
                        <div class="card h-100">
                            <div class="card-header">
                                <h5 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-code me-3"></i>
                                    API Response
                                </h5>
                            </div>
                            <div class="card-body p-4">
                                <textarea id="responseArea" class="form-control h-100" readonly 
                                    placeholder="API response will appear here..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
