<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Script Upload</title>
    
    <!-- CSS -->
    <link href="/static/bootstrap.min.css" rel="stylesheet" data-no-maps>
    <link href="/static/fontawesome/css/all.min.css" rel="stylesheet" data-no-maps>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-11">
                <div class="alert alert-dismissible fade mb-3" role="alert" id="alertBox">
                    <span id="alertMessage"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- Server URL Input Section -->
                <div class="row g-4 mb-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-server me-3"></i>
                                    Server Connection
                                </h4>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="url-input-container mb-0">
                                            <label for="serverUrl" class="form-label">Server URL/IP</label>
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fas fa-link"></i>
                                                </span>
                                                <input type="text" 
                                                       class="form-control" 
                                                       id="serverUrl" 
                                                       placeholder="Enter server URL or IP address"
                                                       value="192.168.31.31">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="url-input-container mb-0">
                                            <label for="serverPort" class="form-label">Port</label>
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fas fa-plug"></i>
                                                </span>
                                                <input type="text" 
                                                       class="form-control" 
                                                       id="serverPort" 
                                                       placeholder="Enter port number"
                                                       value="41950">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Pipette and Light Control Section -->
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-robot me-3"></i>
                                    Pipette Control
                                </h4>
                            </div>
                            <div class="card-body">
                                <button class="btn btn-success" id="movePipetteBtn">
                                    <i class="fas fa-arrows-alt me-2"></i>Move Pipette to Slot 1
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-lightbulb me-3"></i>
                                    Light Control
                                    <button class="btn btn-sm btn-outline-secondary ms-auto" id="refreshLightsBtn">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </h4>
                            </div>
                            <div class="card-body">
                                <div class="d-flex flex-column gap-3">
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" id="lightingToggle">
                                                <label class="form-check-label" for="lightingToggle">
                                                    <i class="fas fa-sun me-2"></i>Lighting
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" id="uvToggle">
                                                <label class="form-check-label" for="uvToggle">
                                                    <i class="fas fa-radiation me-2"></i>Ultraviolet
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <!-- Upload Card -->
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h4 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-upload me-3"></i>
                                    Protocol Script Upload
                                    <small class="ms-auto" style="font-size: 0.8rem;">Max size: 5MB</small>
                                </h4>
                            </div>
                            <div class="card-body p-4">
                                <div class="drag-area" id="dropZone">
                                    <div class="upload-icon">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                    </div>
                                    <div class="upload-text">
                                        <h5 class="mb-1">Upload your Python/JSON script</h5>
                                        <p class="text-muted mb-3">Drag and drop your file here or click to browse</p>
                                        <p class="file-hint">.py and .json only</p>
                                    </div>
                                    <button class="btn btn-outline" id="browseBtn">
                                        Choose file
                                    </button>
                                    <input type="file" id="fileInput" accept=".py,.json" single hidden>
                                </div>
                                
                                <div class="file-info" id="fileInfo">
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-file-code text-primary me-3 fa-lg"></i>
                                        <span id="fileName" class="me-auto fw-bold"></span>
                                        <button class="btn btn-sm btn-danger" id="removeFile">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="upload-progress" id="uploadProgress">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                             role="progressbar" style="width: 0%">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mt-4 text-end">
                                    <button class="btn btn-success me-2 mb-2" id="stopBtn" disabled>
                                        <i class="fas fa-stop-circle me-2"></i>Stop Running
                                    </button>
                                    <button class="btn btn-success mb-2" id="uploadBtn" disabled>
                                        <i class="fas fa-paper-plane me-2"></i>Upload Script
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Response Display Area -->
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h5 class="mb-0 d-flex align-items-center">
                                    <i class="fas fa-code me-3"></i>
                                    API Response
                                </h5>
                            </div>
                            <div class="card-body p-4">
                                <textarea id="responseArea" class="form-control h-100" readonly 
                                    placeholder="API response will appear here..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/jquery.min.js" data-no-maps></script>
    <script src="/static/popper.min.js" data-no-maps></script>
    <script src="/static/bootstrap.min.js" data-no-maps></script>
    <script src="/static/script.js"></script>
</body>
</html>
